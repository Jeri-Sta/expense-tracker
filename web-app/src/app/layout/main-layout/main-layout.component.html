<div class="layout-wrapper">
  <!-- Top Navigation Bar -->
  <div class="layout-topbar">
    <div class="topbar-content">
      <!-- Left Side - Logo & Menu Button -->
      <div class="topbar-left">
        <button
          #sidebarToggle
          type="button"
          class="sidebar-toggle-btn p-link"
          (click)="toggleSidebar()"
          pButton
          icon="pi pi-bars"
          [text]="true"
          aria-label="Abrir menu principal"
          aria-controls="mainNavigation"
          [attr.aria-expanded]="sidebarVisible"
        ></button>

        <a class="app-logo" routerLink="/dashboard" aria-label="Expense Tracker — Dashboard">
          <i class="pi pi-wallet text-primary text-2xl mr-2"></i>
          <span class="app-title">Expense Tracker</span>
        </a>
      </div>

      <!-- Right Side - Page Info -->
      <div class="topbar-right">
        <div class="page-info">
          <i [class]="getPageIcon()" class="text-primary mr-2"></i>
          <span class="page-title">{{ getPageTitle() }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Sidebar Navigation -->
  <p-sidebar
    [(visible)]="sidebarVisible"
    position="left"
    [modal]="true"
    [dismissible]="true"
    [closeOnEscape]="true"
    [blockScroll]="true"
    ariaCloseLabel="Fechar menu principal"
    styleClass="layout-sidebar"
    (onShow)="onSidebarShow()"
    (onHide)="onSidebarHide()"
  >
    <ng-template pTemplate="header">
      <div class="sidebar-navigation">
        <div class="sidebar-header">
          <i class="pi pi-wallet text-primary text-2xl"></i>
          <span class="sidebar-title">Menu Principal</span>
        </div>
      </div>
    </ng-template>

    <div class="sidebar-navigation">
      <div class="sidebar-content">
        <!-- Navigation Menu -->
        <nav id="mainNavigation" class="sidebar-nav" aria-label="Menu principal">
          <ul class="nav-list">
            <li class="nav-item">
              <a
                #firstNavLink
                routerLink="/dashboard"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                class="nav-link"
                (click)="closeSidebar()"
              >
                <i class="pi pi-chart-line nav-icon"></i>
                <span class="nav-label">Dashboard</span>
              </a>
            </li>

            <li class="nav-item">
              <a
                routerLink="/transactions"
                routerLinkActive="active"
                class="nav-link"
                (click)="closeSidebar()"
              >
                <i class="pi pi-credit-card nav-icon"></i>
                <span class="nav-label">Transações</span>
              </a>
            </li>

            <li class="nav-item">
              <a
                routerLink="/categories"
                routerLinkActive="active"
                class="nav-link"
                (click)="closeSidebar()"
              >
                <i class="pi pi-tags nav-icon"></i>
                <span class="nav-label">Categorias</span>
              </a>
            </li>

            <li class="nav-item">
              <a
                routerLink="/recurring-transactions"
                routerLinkActive="active"
                class="nav-link"
                (click)="closeSidebar()"
              >
                <i class="pi pi-refresh nav-icon"></i>
                <span class="nav-label">Recorrências</span>
              </a>
            </li>

            <li class="nav-item">
              <a
                routerLink="/installments"
                routerLinkActive="active"
                class="nav-link"
                (click)="closeSidebar()"
              >
                <i class="pi pi-calculator nav-icon"></i>
                <span class="nav-label">Financiamentos</span>
              </a>
            </li>

            <li class="nav-item">
              <a
                routerLink="/credit-cards"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                class="nav-link"
                (click)="closeSidebar()"
              >
                <i class="pi pi-wallet nav-icon"></i>
                <span class="nav-label">Cartões de Crédito</span>
              </a>
            </li>

            <li class="nav-item">
              <a
                routerLink="/credit-cards/transactions"
                routerLinkActive="active"
                class="nav-link"
                (click)="closeSidebar()"
              >
                <i class="pi pi-file nav-icon"></i>
                <span class="nav-label">Faturas de Cartão</span>
              </a>
            </li>

            <li class="nav-divider"></li>

            <li class="nav-item">
              <a
                routerLink="/settings"
                routerLinkActive="active"
                class="nav-link"
                (click)="closeSidebar()"
              >
                <i class="pi pi-cog nav-icon"></i>
                <span class="nav-label">Configurações</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </p-sidebar>

  <!-- Main Content Area -->
  <div class="layout-main" [class.sidebar-open]="sidebarVisible">
    <div class="main-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
