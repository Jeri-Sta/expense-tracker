<section class="category-summary content-panel content-panel--outlined">
  <header class="category-summary-header">
    <div>
      <span class="panel-eyebrow">Onde saíram</span>
      <h2>Maiores despesas</h2>
      <p>As categorias com maior participação no período.</p>
    </div>
  </header>

  <div class="category-list">
    <div class="category-stat-row" *ngFor="let category of categoryStats.slice(0, 5)">
      <div class="category-stat-topline">
        <span class="category-name">
          <i
            [class]="normalizeIcon(category.categoryIcon)"
            [style.color]="category.categoryColor"
            aria-hidden="true"
          ></i>
          <strong [title]="category.categoryName">{{ category.categoryName }}</strong>
          <small>{{ category.transactionCount }} lanç.</small>
        </span>
        <strong class="category-amount data-value">{{ formatCurrency(category.amount) }}</strong>
      </div>
      <div class="category-progress-row">
        <p-progressBar
          [value]="category.percentage || 0"
          [showValue]="false"
          [style]="{ height: '5px' }"
          [attr.aria-label]="
            category.categoryName + ': ' + (category.percentage || 0).toFixed(1) + '% das despesas'
          "
        ></p-progressBar>
        <span>{{ (category.percentage || 0).toFixed(1) }}%</span>
      </div>
    </div>
  </div>
</section>
